services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resto_saas
    ports:
      - "5432:5432"
    volumes:
      - resto_saas_pgdata:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resto_saas"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  resto_saas_pgdata:
